<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Serverless Website on AWS S3</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; }
        p { line-height: 1.6; color: #94a3b8; }
        .badge { display: inline-block; background: #0284c7; color: #ffffff; padding: 8px 16px; border-radius: 20px; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Hosted on AWS S3!</h1>
        <p>Welcome to my static website hosted directly from an Amazon S3 Bucket.</p>
        <div class="badge">Status: Live & Fast ⚡</div>
    </div>
</body>
</html>
